<title>Somos Guafra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Concepto: herramienta de oficina sobria, al estilo de un calendario de escritorio. Blanco, líneas finas grises, un solo azul, sin animaciones. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F1F3F4; --canvas:#F6F8FC; --ink:#1F1F1F; --ink2:#444746; --ink3:#5F6368;
  --line:#E0E2E6; --line2:#C4C7C5; --accent:#1A5FD0; --accent-h:#164FAE; --on-accent:#FFFFFF; --accent-soft:#D9E6FB; --accent-ink:#0B3A85;
  --pos:#137333; --pos-soft:#E6F4EA; --neg:#C5221F; --neg-soft:#FCE8E6; --warn:#A35200; --warn-soft:#FEF0D8;
  --f-d:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --f-b:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:8px; --r-s:6px; --side:264px; --shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15); --shadow-s:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1C1F; --surface:#1B1C1F; --sunk:#2A2B2F; --canvas:#131416; --ink:#E3E3E3; --ink2:#C4C7C5; --ink3:#9AA0A6; --line:#3A3C40; --line2:#5A5D61;
  --accent:#A8C7FA; --accent-h:#C2D7FB; --on-accent:#0A2A66; --accent-soft:#233A63; --accent-ink:#D3E3FD; --pos:#6DD58C; --pos-soft:#1E3524; --neg:#F2B8B5; --neg-soft:#4A2422; --warn:#FDD663; --warn-soft:#3F3413;
  --shadow:0 1px 3px rgba(0,0,0,.5),0 4px 8px 3px rgba(0,0,0,.35); --shadow-s:0 1px 2px rgba(0,0,0,.5),0 1px 3px 1px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1C1F; --surface:#1B1C1F; --sunk:#2A2B2F; --canvas:#131416; --ink:#E3E3E3; --ink2:#C4C7C5; --ink3:#9AA0A6; --line:#3A3C40; --line2:#5A5D61;
  --accent:#A8C7FA; --accent-h:#C2D7FB; --on-accent:#0A2A66; --accent-soft:#233A63; --accent-ink:#D3E3FD; --pos:#6DD58C; --pos-soft:#1E3524; --neg:#F2B8B5; --neg-soft:#4A2422; --warn:#FDD663; --warn-soft:#3F3413;
  --shadow:0 1px 3px rgba(0,0,0,.5),0 4px 8px 3px rgba(0,0,0,.35); --shadow-s:0 1px 2px rgba(0,0,0,.5),0 1px 3px 1px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-b);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none;font-weight:500}
a:hover{color:var(--accent-h)}
h1,h2,h3,h4{font-family:var(--f-d);margin:0;line-height:1.25;text-wrap:balance;font-weight:400;color:var(--ink)}
h1{font-size:22px} h2{font-size:16px;font-weight:500} h3{font-size:14px;font-weight:500}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mut{color:var(--ink3)} .pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.num{font-weight:500;white-space:nowrap}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--accent);font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap;letter-spacing:.01em}
.btn:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-h);border-color:var(--accent-h);box-shadow:var(--shadow-s)}
.btn.ghost{border-color:transparent;padding:0 12px}
.btn.danger{color:var(--neg);border-color:var(--line2)}
.btn.danger:hover{background:var(--neg-soft)}
.btn.sm{min-height:32px;padding:0 14px;font-size:13.5px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn .ic{width:18px;height:18px}
.ib{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink3);cursor:pointer;flex:none}
.ib:hover{background:var(--sunk);color:var(--ink)}
.create{display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 24px 0 16px;border-radius:16px;border:0;background:var(--surface);color:var(--ink);font-weight:500;font-size:14px;box-shadow:var(--shadow-s);cursor:pointer;margin:4px 0 12px 4px;align-self:flex-start}
.create:hover{box-shadow:var(--shadow);background:var(--canvas)}
.create .ic{width:24px;height:24px;color:var(--accent);stroke-width:2.2}

/* Formularios */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:12.5px;font-weight:500;color:var(--ink3)}
.f small{color:var(--ink3);font-size:12px}
input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--line2);border-radius:4px;background:var(--surface);outline:0}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.amount-in{font-size:24px!important;min-height:52px!important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form{display:flex;flex-direction:column;gap:14px}
.ferr{color:var(--neg);font-weight:500;font-size:13.5px}
.ferr:empty{display:none}
.hint{font-size:12.5px;color:var(--ink3)}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;flex-wrap:nowrap}
.seg label,.seg button{flex:1;position:relative;cursor:pointer;border:0;background:none;padding:0;min-width:0}
.seg label+label,.seg button+button{border-left:1px solid var(--line2)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span,.seg button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 12px;font-weight:500;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg input:checked+span,.seg button.on{background:var(--accent-soft);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0}
.chip span{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--ink2)}
.chip input:checked+span{border-color:transparent;background:var(--accent-soft);color:var(--accent-ink)}
.chip input:focus-visible+span{outline:2px solid var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;margin-top:1px;accent-color:var(--accent)}
.sw{position:relative;display:inline-block;width:36px;height:20px;flex:none}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:3px 0;border-radius:99px;background:var(--line2)}
.sw i::after{content:"";position:absolute;left:0;top:-3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-s)}
.sw input:checked+i{background:color-mix(in srgb,var(--accent) 55%,transparent)}
.sw input:checked+i::after{transform:translateX(16px);background:var(--accent)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:4px}

/* Piezas */
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;min-width:0}
.box>header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;min-height:32px}
.box>header h2{font-size:16px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:4px;font-size:11.5px;font-weight:500;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.pill .ic{width:14px;height:14px}
.pill.pos{background:var(--pos-soft);color:var(--pos)} .pill.neg{background:var(--neg-soft);color:var(--neg)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;flex:none;line-height:1}
.tile small{order:-1;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);font-weight:500;margin-bottom:4px}
.tile b{font-size:22px;font-weight:400;color:var(--ink)}
.tile .ic{width:20px;height:20px;color:var(--ink3)}
.tile.late b,.tile.late small{color:var(--neg)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.rows>.row:first-child,.rows>.dayh+.row{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:400;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--ink3);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.row.click{cursor:pointer;margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:6px}
.row.click:hover{background:var(--sunk)}
.row .amt{font-weight:500;white-space:nowrap;text-align:right}
.row.rev .t,.row.rev .amt{text-decoration:line-through;color:var(--ink3)}
.dayh{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:16px 0 6px;border-bottom:1px solid var(--line)}
.dayh:first-child{padding-top:2px}
.empty{border:1px solid var(--line);border-radius:var(--r);padding:32px 24px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--surface)}
.empty b{font-size:16px;font-weight:500}
.empty p{color:var(--ink3);max-width:60ch}
.empty .btn{margin-top:12px}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.c{background:var(--line2)} .bar i.over{background:var(--neg)} .bar i.ok{background:var(--pos)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv span{color:var(--ink2)}
.kv b{font-weight:500;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.stat{padding:12px 18px;min-width:0;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat span{display:block;font-size:12.5px;color:var(--ink3)}
.stat b{display:block;font-size:20px;font-weight:400;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:12px 16px;font-weight:500;font-size:14px;color:var(--ink3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{background:var(--sunk);color:var(--ink)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.mnav{display:inline-flex;align-items:center;gap:2px}
.mnav b{min-width:150px;font-size:20px;font-weight:400;padding:0 8px}
.mnav .ib{order:-1}
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--ink3);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:500;border-bottom:0;border-top:1px solid var(--line2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--canvas)}
.note{display:flex;gap:12px;padding:12px 16px;border-radius:var(--r);background:var(--canvas);border:1px solid var(--line);color:var(--ink2);font-size:13.5px;align-items:flex-start}
.note .ic{color:var(--accent);margin-top:0}
.note.warn{background:var(--warn-soft);border-color:transparent} .note.warn .ic{color:var(--warn)}
.note.neg{background:var(--neg-soft);border-color:transparent} .note.neg .ic{color:var(--neg)}
.note.pos{background:var(--pos-soft);border-color:transparent} .note.pos .ic{color:var(--pos)}
details.more>summary{cursor:pointer;font-weight:500;color:var(--accent);list-style:none;padding:4px 0}
details.more>summary::-webkit-details-marker{display:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.hrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* App */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:64px minmax(0,1fr);min-height:100vh;background:var(--bg)}
.top{grid-column:1/-1;grid-row:1;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;height:64px;background:var(--bg);border-bottom:1px solid var(--line);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .logo{display:flex;padding:0 8px 0 4px;width:calc(var(--side) - 60px)}
.top .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:500;font-size:13px;border:0;cursor:pointer;margin-left:6px}
.side{grid-row:2;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;scrollbar-width:none;background:var(--bg);padding:8px 12px 16px 0;display:flex;flex-direction:column}
.side::-webkit-scrollbar{display:none}
.side>.logo{display:none}
.logo{display:flex;align-items:center;gap:10px;color:var(--ink)}
.logo:hover{color:var(--ink)}
.mark{width:30px;height:30px;border-radius:7px;background:var(--accent);flex:none;display:grid;place-items:center}
.mark::before{content:"N";color:var(--on-accent);font:500 16px/1 var(--f-d)}
.logo b{font-size:20px;font-weight:400;color:var(--ink2);letter-spacing:0}
.navg{display:flex;flex-direction:column;margin-top:8px}
.navg h6{margin:0;padding:12px 24px 4px;font-size:11px;letter-spacing:.06em;color:var(--ink3);font-weight:500;text-transform:uppercase}
.navg a{display:flex;align-items:center;gap:16px;height:36px;padding:0 16px 0 24px;border-radius:0 999px 999px 0;color:var(--ink2);font-weight:400;font-size:14px}
.navg a .ic{color:var(--ink3);width:20px;height:20px}
.navg a:hover{background:var(--sunk);color:var(--ink)}
.navg a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.navg a.on .ic{color:var(--accent-ink)}
.navg a .badge{margin-left:auto;color:var(--neg);font-size:12px;font-weight:500}
.side .create{margin-left:12px}
.side-user{margin-top:auto;padding:16px 8px 0 24px;display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:500;font-size:13px;flex:none}
.side-user .grow{min-width:0;flex:1}
.side-user .t{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{grid-row:2;min-width:0;display:flex;flex-direction:column}
.page{width:100%;max-width:1160px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;min-height:40px}
.ph p{color:var(--ink3);margin-top:4px;max-width:70ch;font-size:13.5px}
.ph-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scrim{display:none}
.tabbar{display:none}
.top .menu-btn{display:inline-grid}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px}
.lbl{font-size:13px;color:var(--ink3)}
.big{font-size:clamp(30px,4vw,40px);font-weight:400;line-height:1.1;margin:4px 0 6px;overflow-wrap:anywhere;color:var(--ink)}
.hero-r{display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line);padding-left:32px}
.kv.tot{border-top:1px solid var(--line2);margin-top:2px;padding-top:10px}
.kv.tot span{color:var(--ink);font-weight:500}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px 0 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:500;font-size:13.5px;color:var(--ink2)}
.quick button:hover{background:var(--sunk)}
.quick .qi{display:grid;place-items:center}
.quick .qi .ic{width:18px;height:18px}
.quick .qi.o{color:var(--neg)} .quick .qi.i{color:var(--pos)} .quick .qi.t{color:var(--accent)}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.steps{display:flex;flex-direction:column}
.step{display:flex;align-items:center;gap:14px;padding:8px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none}
.step.done .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step.done .dot .ic{width:12px;height:12px;stroke-width:3.2}
.step.done .grow{color:var(--ink3)}
.step .grow{flex:1}

/* Diálogos */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
.scrim2{position:absolute;inset:0;background:rgba(32,33,36,.45)}
.sheet{position:relative;width:min(560px,100%);max-height:calc(100vh - 48px);background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow);border-radius:12px;overflow:hidden}
.sheet>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 12px 4px 24px}
.sheet>header h2{font-size:20px;font-weight:400}
.sheet-b{flex:1;overflow-y:auto;padding:8px 24px 24px}
.toast{position:fixed;left:24px;bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 16px));z-index:60;background:#303134;color:#E8EAED;padding:14px 20px;border-radius:6px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 48px)}

/* Simulador */
.verdict{border-radius:var(--r);padding:18px 20px;border:1px solid var(--line);border-left-width:4px}
.verdict.yes{border-left-color:var(--pos)} .verdict.no{border-left-color:var(--neg)}
.verdict-big{font-size:22px;font-weight:400}
.verdict.yes .verdict-big{color:var(--pos)} .verdict.no .verdict-big{color:var(--neg)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;gap:6px;align-items:center;height:32px;padding:0 12px;border-radius:8px;font-size:13.5px;font-weight:500;border:1px solid var(--line2);color:var(--ink2)}
.opt.ok{color:var(--pos)} .opt.ko{color:var(--neg)}
.split{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:16px;align-items:start}
.presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.preset{border:1px solid var(--line2);border-radius:var(--r);padding:10px 14px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.preset:hover{background:var(--sunk)}

/* ---------- Dinero (en centavos) ---------- */
function parseMoney(raw){
  if(raw==null)return null;let s=String(raw).trim();if(!s)return null;
  const neg=/^[-−(]/.test(s);s=s.replace(/[^\d.,]/g,'');if(!s)return null;
  const i=Math.max(s.lastIndexOf(','),s.lastIndexOf('.'));let ip=s,fp='';
  if(i>=0){const after=s.length-i-1;const both=s.includes(',')&&s.includes('.');if(both||(after>0&&after<=2)){ip=s.slice(0,i);fp=s.slice(i+1)}}
  ip=ip.replace(/[.,]/g,'');if(!ip&&!fp)return null;
  const v=parseInt(ip||'0',10)*100+parseInt((fp+'00').slice(0,2),10);
  return isNaN(v)?null:(neg?-v:v);
}
function fmt(c,cur,o){o=o||{};cur=cur||base();const C=CURM[cur]||{sym:cur,dec:2};const d=o.short?0:C.dec;
  let s;try{s=new Intl.NumberFormat(loc(),{minimumFractionDigits:d,maximumFractionDigits:d}).format(Math.abs(c||0)/100)}catch(e){s=(Math.abs(c||0)/100).toFixed(d)}
  const sign=c<0?'−':(o.sign&&c>0?'+':'');return sign+C.sym+' '+s}
const inp=c=>c==null?'':(c/100).toFixed(2).replace('.',',');
function allocate(total,n){const b=Math.floor(total/n);const r=total-b*n;return Array.from({length:n},(_,i)=>b+(i<r?1:0))}
const curName=c=>(CURM[c]?CURM[c].name:c);

/* ---------- Fechas ---------- */
function today(){try{return new Intl.DateTimeFormat('en-CA',{timeZone:tz(),year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(e){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}}
const P3=iso=>{const a=iso.split('-').map(Number);return {y:a[0],m:a[1]-1,d:a[2]}};
function ymd(y,m,d){const t=new Date(Date.UTC(y,m,1));const Y=t.getUTCFullYear(),M=t.getUTCMonth();const last=new Date(Date.UTC(Y,M+1,0)).getUTCDate();return Y+'-'+pad(M+1)+'-'+pad(Math.max(1,Math.min(d,last)))}
function addDays(iso,n){const p=P3(iso);return new Date(Date.UTC(p.y,p.m,p.d+n)).toISOString().slice(0,10)}
function addMonths(iso,n,day){const p=P3(iso);return ymd(p.y,p.m+n,day||p.d)}
const mk=iso=>iso.slice(0,7);
function mkAdd(k,n){const a=k.split('-').map(Number);return ymd(a[0],a[1]-1+n,1).slice(0,7)}
const lastDay=k=>addDays(mkAdd(k,1)+'-01',-1);
const wday=iso=>new Date(iso+'T00:00:00Z').getUTCDay();
function fmtDate(iso,y){if(!iso)return '—';const p=P3(iso);return p.d+' '+MES3[p.m]+((y||p.y!==P3(today()).y)?' '+p.y:'')}
const fmtMonth=k=>{const a=k.split('-').map(Number);return cap(MES[a[1]-1])+' '+a[0]};
const fmtLong=iso=>{const p=P3(iso);return cap(DIAS[wday(iso)])+' '+p.d+' de '+MES[p.m]};
const monthsBetween=(a,b)=>{const x=P3(a),y=P3(b);return (y.y-x.y)*12+(y.m-x.m)};
const byDue=(a,b)=>a.due<b.due?-1:a.due>b.due?1:0;
const byDateDesc=(a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.created<b.created?1:-1);

/* ---------- Cuentas y movimientos ---------- */
const acc=id=>S.accounts.find(a=>a.id===id);
const accName=id=>{const a=acc(id);return a?a.name:'—'};
const cat=id=>S.cats.find(c=>c.id===id);
const catName=id=>{const c=cat(id);return c?c.name:''};
const cashAccs=cur=>S.accounts.filter(a=>!a.archived&&a.type!=='card'&&(!cur||a.cur===cur));
function bal(id){const a=acc(id);let b=a?a.opening||0:0;for(const t of S.tx)if(t.acc===id)b+=t.dir==='IN'?t.amount:-t.amount;return b}
function availBy(){const m={};cashAccs().forEach(a=>{m[a.cur]=(m[a.cur]||0)+bal(a.id)});return m}
function addTx(t){const x=Object.assign({id:uid(),kind:'normal',created:new Date().toISOString()},t);const a=acc(x.acc);x.cur=a?a.cur:base();S.tx.push(x);return x}
function addObl(o){const x=Object.assign({id:uid(),cancelled:false,created:new Date().toISOString()},o);if(!x.cur){const a=acc(x.acc);x.cur=a?a.cur:base()}S.obl.push(x);return x}
function paidOf(o){let s=0;for(const t of S.tx)if(t.obl===o.id&&!t.revBy)s+=t.amount;return s}
const rem=o=>Math.max(0,o.amount-paidOf(o));
function st(o){if(o.cancelled)return 'cancelled';const r=rem(o);if(r<=0)return 'settled';return paidOf(o)>0?'partial':'pending'}
const isOpen=o=>!o.cancelled&&rem(o)>0;
const late=o=>isOpen(o)&&o.due<today();
function payObl(o,amt,date,accId){
  if(o.dir==='REC'){addTx({date,desc:o.desc,amount:amt,dir:'IN',acc:accId,cat:o.cat,obl:o.id});return}
  if(o.source==='card'){const card=S.cards.find(c=>c.id===o.sid);const g=uid();addTx({date,desc:'Pago de '+(card?card.name:'tarjeta'),amount:amt,dir:'OUT',acc:accId,kind:'transfer',group:g,obl:o.id});if(card)addTx({date,desc:'Pago desde '+accName(accId),amount:amt,dir:'IN',acc:card.acc,kind:'transfer',group:g});return}
  if(o.source==='debt'){addTx({date,desc:o.desc,amount:amt,dir:'OUT',acc:accId,kind:'debt_pay',obl:o.id});const d=S.debts.find(x=>x.id===o.sid);if(d&&S.obl.filter(x=>x.source==='debt'&&x.sid===d.id).every(x=>!isOpen(x)))d.closed=today();return}
  addTx({date,desc:o.desc,amount:amt,dir:'OUT',acc:accId,cat:o.cat,obl:o.id});
}
function reverse(t){const grp=t.group?S.tx.filter(x=>x.group===t.group):[t];grp.forEach(x=>{if(x.revBy||x.revOf)return;const r=addTx({date:today(),desc:'Anulación: '+x.desc,amount:x.amount,dir:x.dir==='IN'?'OUT':'IN',acc:x.acc,kind:x.kind,revOf:x.id});x.revBy=r.id;S.obl.filter(o=>o.pid===x.id&&isOpen(o)).forEach(o=>o.cancelled=true)})}
function monthSum(k,cur){cur=cur||base();let inc=0,out=0,debt=0,toPay=0,toGet=0;const isNow=k===mk(today()),t=today();
  for(const x of S.tx){if(x.cur!==cur||mk(x.date)!==k||x.revBy||x.revOf)continue;if(x.kind==='normal'){if(x.dir==='IN')inc+=x.amount;else out+=x.amount}else if(x.kind==='debt_pay')debt+=x.amount}
  for(const o of S.obl){if(!isOpen(o)||o.cur!==cur)continue;if(!(mk(o.due)===k||(isNow&&o.due<t)))continue;if(o.dir==='REC')toGet+=rem(o);else toPay+=rem(o)}
  return {inc,out,debt,toPay,toGet}}

/* ---------- Pagos que se repiten ---------- */
function adjW(d,w){const x=wday(d);if(w==='next'){if(x===6)return addDays(d,2);if(x===0)return addDays(d,1)}if(w==='prev'){if(x===6)return addDays(d,-1);if(x===0)return addDays(d,-2)}return d}
function occ(r,from,to){const out=[];const st0=r.start;for(let i=0;i<800;i++){const d=r.freq==='semanal'?addDays(st0,7*i):r.freq==='anual'?addMonths(st0,12*i,r.day):addMonths(st0,i,r.day);if(r.until&&d>r.until)break;if(d>to)break;if(r.from&&d<r.from)continue;const a=adjW(d,r.weekend);if(a>=from&&a<=to)out.push({date:a,key:d})}return out}
function amountFor(r,key){let a=r.amount;(r.changes||[]).slice().sort((x,y)=>x.from<y.from?-1:1).forEach(c=>{if(key>=c.from)a=c.amount});return a}
function nextOcc(r){const x=occ(r,today(),addDays(today(),400)).find(o=>!r.made.includes(o.key));return x?x.date:null}
function materialize(){const h=addDays(today(),MAT);S.rules.forEach(r=>{if(r.paused)return;occ(r,r.start,h).forEach(o=>{if(r.made.includes(o.key))return;r.made.push(o.key);addObl({desc:r.desc,amount:amountFor(r,o.key),dir:r.dir,due:o.date,cat:r.cat,acc:r.acc,cur:r.cur,source:'rule',sid:r.id})})})}

/* ---------- Proyección ---------- */
function forecast(months,extra,opt){extra=extra||[];opt=opt||{};const cur=base(),t=today(),k0=mk(t);const end=lastDay(mkAdd(k0,months-1));const h=addDays(t,MAT);const ev=[];
  const adj=(o,a)=>o.dir==='PAY'&&opt.pct&&o.source!=='card'&&o.source!=='debt'?Math.round(a*(1+opt.pct/100)):a;
  for(const o of S.obl){if(!isOpen(o)||o.cur!==cur)continue;if(opt.drop&&o.source==='rule'&&o.sid===opt.drop)continue;const d=o.due<t?t:o.due;if(d>end)continue;const a=adj(o,rem(o));ev.push({d,a:o.dir==='REC'?a:-a})}
  for(const r of S.rules){if(r.paused||r.cur!==cur||r.id===opt.drop)continue;for(const x of occ(r,addDays(h,1),end)){if(r.made.includes(x.key))continue;const a=adj(r,amountFor(r,x.key));ev.push({d:x.date,a:r.dir==='REC'?a:-a})}}
  extra.forEach(e=>{if(e.d<=end)ev.push({d:e.d<t?t:e.d,a:e.a})});
  ev.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  let run=availBy()[cur]||0,i=0;const rows=[];
  for(let m=0;m<months;m++){const k=mkAdd(k0,m),ld=lastDay(k);const start=run;let inn=0,out=0,min=run,minD=m===0?t:k+'-01';
    while(i<ev.length&&ev[i].d<=ld){run+=ev[i].a;if(ev[i].a>0)inn+=ev[i].a;else out-=ev[i].a;if(run<min){min=run;minD=ev[i].d}i++}
    rows.push({k,start,inn,out,end:run,min,minD})}
  return rows}
function afford(total,n,first,cushion){const parts=allocate(total,n);const ex=parts.map((a,i)=>({d:addMonths(first,i),a:-a}));const months=Math.min(60,Math.max(12,monthsBetween(today(),addMonths(first,n-1))+2));
  const b=forecast(months),w=forecast(months,ex);const worst=w.reduce((m,r)=>r.min<m.min?r:m,w[0]);return {ok:worst.min>=cushion,cuota:parts[0],worst,base:b,rows:w,parts,first}}

/* ---------- Tarjetas y deudas ---------- */
function firstDue(card,date){const p=P3(date);const cm=p.d<=card.close?p.m:p.m+1;const dm=card.due>card.close?cm:cm+1;return ymd(p.y,dm,card.due)}
function schedule(P,n,tna,sys,first){const i=sys==='sin'?0:(tna||0)/100/12;const rows=[];let b=P;const fr=sys==='frances'&&i>0?Math.round(P*i/(1-Math.pow(1+i,-n))):null;
  for(let k=0;k<n;k++){let it=Math.round(b*i),cp;const last=k===n-1;
    if(sys==='americano')cp=last?b:0;else if(fr!=null)cp=last?b:fr-it;else cp=last?b:Math.round(P/n);
    b-=cp;rows.push({n:k+1,date:addMonths(first,k),cap:cp,int:it,total:cp+it,bal:b})}
  return rows}
function debtInfo(d){const os=S.obl.filter(o=>o.source==='debt'&&o.sid===d.id).sort(byDue);const open=os.filter(isOpen);let principal=0;open.forEach(o=>{principal+=Math.round((o.cap||0)*rem(o)/o.amount)});return {os,open,principal,owed:open.reduce((s,o)=>s+rem(o),0),next:open[0]}}
function cardDebt(c){return Math.max(0,-bal(c.acc))}

/* ---------- Inversiones y patrimonio ---------- */
function invInfo(v){let invested=0;v.moves.forEach(m=>invested+=m.type==='in'?m.amount:-m.amount);const lv=v.vals[v.vals.length-1];const value=lv?lv.value:invested;return {invested,value,gain:value-invested,valAt:lv?lv.date:null}}
function toBase(a,cur){if(cur===base())return a;const r=S.rates[cur];return r?Math.round(a*r):null}
function netWorth(){const lines=[];
  cashAccs().forEach(a=>lines.push({g:'Dinero',n:a.name,a:bal(a.id),cur:a.cur}));
  if(S.modules.inversiones)S.inv.forEach(v=>lines.push({g:'Inversiones',n:v.name,a:invInfo(v).value,cur:v.cur}));
  if(S.modules.activos)S.assets.forEach(x=>lines.push({g:'Bienes',n:x.name,a:x.vals[x.vals.length-1].value,cur:x.cur}));
  S.cards.forEach(c=>{const d=cardDebt(c);if(d)lines.push({g:'Tarjetas',n:c.name,a:-d,cur:acc(c.acc).cur})});
  S.debts.forEach(d=>{const i=debtInfo(d);if(i.principal)lines.push({g:'Deudas',n:d.name,a:-i.principal,cur:d.cur})});
  let assets=0,liab=0;const missing=new Set();lines.forEach(l=>{l.b=toBase(l.a,l.cur);if(l.b==null){missing.add(l.cur);return}if(l.b>=0)assets+=l.b;else liab-=l.b});
  return {lines,assets,liab,net:assets-liab,missing:[...missing]}}
function grainCalc(f){const kg=f.kg,price=f.price,fx=f.fx||1;const gross=Math.round(kg/1000*price*fx);const tax=Math.round(gross*f.taxPct/100);return {gross,tax,net:gross-tax-(f.other||0)}}

/* ---------- Alertas ---------- */
function insights(){const out=[],t=today(),cur=base();const av=availBy()[cur]||0;
  const lt=S.obl.filter(o=>late(o)&&o.dir==='PAY');if(lt.length)out.push(['neg','Tenés '+lt.length+(lt.length>1?' pagos atrasados':' pago atrasado'),'Suman '+fmt(lt.reduce((s,o)=>s+(o.cur===cur?rem(o):0),0))+'. No se borran solos: pagalos o cancelalos.','proximos']);
  const lr=S.obl.filter(o=>late(o)&&o.dir==='REC');if(lr.length)out.push(['warn','Hay '+lr.length+' cobro'+(lr.length>1?'s':'')+' sin registrar','La fecha ya pasó. Si ya te pagaron, registralo.','proximos']);
  const w=S.obl.filter(o=>isOpen(o)&&o.dir==='PAY'&&o.cur===cur&&o.due>=t&&o.due<=addDays(t,7)).reduce((s,o)=>s+rem(o),0);if(w>av)out.push(['neg','Esta semana no te alcanza','Vencen '+fmt(w)+' y tenés '+fmt(av)+' disponible.','proximos']);
  if(S.modules.flujo&&(S.tx.length||S.obl.length)){const f=forecast(12);const bad=f.find(r=>r.min<0);if(bad)out.push(['warn',fmtMonth(bad.k)+' quedaría en rojo','Tu saldo bajaría a '+fmt(bad.min)+' el '+fmtDate(bad.minD)+' si todo sigue como está.','flujo']);else out.push(['pos','Los próximos 12 meses no quedan en rojo','Con lo que cargaste, tu saldo nunca baja de cero.','flujo'])}
  if(S.modules.presupuestos){const k=mk(t),b=S.budgets[k]||{};Object.keys(b).forEach(cid=>{const sp=spentCat(cid,k);if(b[cid]>0&&sp>b[cid])out.push(['warn','Te pasaste en '+catName(cid),'Gastaste '+fmt(sp)+' de '+fmt(b[cid])+'.','presupuestos'])})}
  const exp=S.debts.filter(d=>!d.closed&&d.tna>0).sort((a,b)=>b.tna-a.tna)[0];if(exp&&S.debts.filter(d=>!d.closed).length>1)out.push(['acc','Conviene adelantar '+exp.name,'Es tu deuda más cara (TNA '+String(exp.tna).replace('.',',')+'%). Cada peso que adelantes ahí ahorra más intereses.','deudas']);
  S.goals.forEach(g=>{const s=goalSaved(g);if(g.date&&s<g.target){const ml=Math.max(1,monthsBetween(t,g.date));const need=Math.ceil((g.target-s)/ml);out.push(['acc',g.name+': apartá '+fmt(need,g.cur)+' por mes','Así llegás al '+fmtDate(g.date,1)+'.','objetivos'])}});
  S.cards.forEach(c=>{if(c.limit&&cardDebt(c)>c.limit*.8)out.push(['warn',c.name+' está cerca del límite','Usaste '+fmt(cardDebt(c),acc(c.acc).cur)+' de '+fmt(c.limit,acc(c.acc).cur)+'.','tarjetas'])});
  return out}
function spentCat(cid,k){let s=0;S.tx.forEach(x=>{if(x.cat===cid&&x.kind==='normal'&&x.dir==='OUT'&&mk(x.date)===k&&!x.revBy&&!x.revOf&&x.cur===base())s+=x.amount});return s}
function committedCat(cid,k){let s=0;S.obl.forEach(o=>{if(o.cat===cid&&o.dir==='PAY'&&isOpen(o)&&mk(o.due)===k&&o.source!=='card'&&o.cur===base())s+=rem(o)});return s}

function barChart(rows,key,labels){const W=640,H=200,L=64,B=26,T=10;const vals=rows.map(r=>r[key]);const mx=Math.max(0,...vals),mn=Math.min(0,...vals);const span=(mx-mn)||1;const y=v=>T+(mx-v)/span*(H-T-B);const bw=(W-L-8)/rows.length;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Saldo al final de cada mes">';
  [mx,mn,(mx+mn)/2].forEach(v=>{s+='<line class="grid" x1="'+L+'" x2="'+W+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+fmt(Math.round(v),null,{short:1})+'</text>'});
  s+='<line class="zero" x1="'+L+'" x2="'+W+'" y1="'+y(0)+'" y2="'+y(0)+'"/>';
  rows.forEach((r,i)=>{const v=r[key];const x=L+i*bw+bw*.18,w=bw*.64;const y1=Math.min(y(v),y(0)),h=Math.max(1.5,Math.abs(y(v)-y(0)));s+='<rect x="'+x+'" y="'+y1+'" width="'+w+'" height="'+h+'" rx="2" fill="'+(v<0?'var(--neg)':'var(--accent)')+'"><title>'+fmtMonth(r.k)+': '+fmt(v)+'</title></rect>';
    if(rows.length<=14||i%Math.ceil(rows.length/12)===0)s+='<text x="'+(x+w/2)+'" y="'+(H-8)+'" text-anchor="middle">'+labels(r,i)+'</text>'});
  return s+'</svg>'}
function pairChart(rows){const W=640,H=200,L=64,B=26,T=10;const mx=Math.max(1,...rows.map(r=>Math.max(r.a,r.b)));const y=v=>T+(mx-v)/mx*(H-T-B);const bw=(W-L-8)/rows.length;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ingresos y gastos por mes">';
  [mx,mx/2,0].forEach(v=>{s+='<line class="grid" x1="'+L+'" x2="'+W+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+fmt(Math.round(v),null,{short:1})+'</text>'});
  rows.forEach((r,i)=>{const x=L+i*bw+bw*.15,w=bw*.33;s+='<rect x="'+x+'" y="'+y(r.a)+'" width="'+w+'" height="'+(y(0)-y(r.a))+'" rx="2" fill="var(--pos)"><title>Entró '+fmt(r.a)+'</title></rect><rect x="'+(x+w+2)+'" y="'+y(r.b)+'" width="'+w+'" height="'+(y(0)-y(r.b))+'" rx="2" fill="var(--neg)"><title>Salió '+fmt(r.b)+'</title></rect><text x="'+(x+w)+'" y="'+(H-8)+'" text-anchor="middle">'+MES3[+r.k.slice(5)-1]+'</text>'});
  return s+'</svg>'}

function calcOut(){const f=k=>parseMoney((document.getElementById('c-'+k)||{}).value);const hoy=f('hoy'),sobra=f('sobra'),precio=f('precio');const n=+(document.getElementById('c-cuotas')||{}).value||1;const el=document.getElementById('calcout');if(!el)return;
  if(hoy==null||sobra==null||!precio){el.className='out';el.innerHTML='<span class="hint">Completá los tres montos y te decimos si te alcanza y cómo queda tu dinero mes a mes.</span>';return}
  const parts=allocate(precio,n);let run=hoy,min=hoy,minM=0;const bars=[];const months=Math.max(6,n);for(let m=0;m<months;m++){run+=sobra-(parts[m]||0);bars.push(run);if(run<min){min=run;minM=m}}
  const ok=min>=0;const mx=Math.max(...bars.map(Math.abs),1);
  el.className='out '+(ok?'yes':'no');el.innerHTML='<span class="v">'+(ok?'Sí, te alcanza':'No te alcanza')+'</span><span>'+(n>1?n+' cuotas de '+fmt(parts[0],'USD').replace('US$ ',''):'Un pago de '+fmt(precio,'USD').replace('US$ ',''))+'. '+(ok?'Tu saldo más bajo sería '+fmt(min,'USD').replace('US$ ','')+'.':'En el mes '+(minM+1)+' quedarías en '+fmt(min,'USD').replace('US$ ','')+'.')+'</span><div class="mini" aria-hidden="true">'+bars.map(b=>'<i class="'+(b<0?'n':'')+'" style="height:'+Math.max(4,Math.abs(b)/mx*100)+'%"></i>').join('')+'</div><span class="hint">Cada barra es un mes. Adentro de Somos Guafra esto se calcula con tus cuentas, cuotas y vencimientos reales.</span>'}

  if(!o.skipAcc&&o.acc.name.trim()){const a={id:uid(),name:o.acc.name.trim(),type:o.acc.type,cur:o.acc.cur,opening:parseMoney(o.acc.amount)||0,created:today()};S.accounts.push(a);
    if(o.sal.on){const day=+o.sal.day;const c=S.cats.find(x=>x.name==='Sueldo');S.rules.push({id:uid(),desc:'Sueldo',amount:parseMoney(o.sal.amount),dir:'REC',cat:c&&c.id,acc:a.id,cur:a.cur,freq:'mensual',day,start:obSalaryDate(day),until:null,weekend:'none',made:[],changes:[]})}}
  log('Bienvenida terminada',o.country+' · '+o.cur);save();UI.ob=null;UI.obStep=0;toast('Listo. Ya podés empezar.');location.hash='inicio'}

/* ---------- 2 pasos (TOTP, RFC 6238) ---------- */
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32enc(bytes){let bits=0,val=0,out='';for(const b of bytes){val=(val<<8)|b;bits+=8;while(bits>=5){out+=B32[(val>>>(bits-5))&31];bits-=5}}if(bits>0)out+=B32[(val<<(5-bits))&31];return out}
function b32dec(s){s=s.replace(/=+$/,'').toUpperCase();let bits=0,val=0;const out=[];for(const c of s){const i=B32.indexOf(c);if(i<0)continue;val=(val<<5)|i;bits+=5;if(bits>=8){out.push((val>>>(bits-8))&255);bits-=8}}return new Uint8Array(out)}
async function totp(secret,step){const key=await crypto.subtle.importKey('raw',b32dec(secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);const buf=new ArrayBuffer(8);const v=new DataView(buf);v.setUint32(0,Math.floor(step/4294967296));v.setUint32(4,step>>>0);const h=new Uint8Array(await crypto.subtle.sign('HMAC',key,buf));const o=h[19]&15;const c=(((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3])%1000000;return String(c).padStart(6,'0')}
async function checkTotp(secret,code){try{const s=Math.floor(Date.now()/30000);for(const d of [-1,0,1])if(await totp(secret,s+d)===code)return true}catch(e){}return false}

/* ---------- Mostrar u ocultar campos según el formulario ---------- */
function fval(form,name){const el=form.elements[name];if(!el)return '';if(el instanceof RadioNodeList){return el.value}if(el.type==='checkbox')return el.checked?'on':'off';if(el.tagName==='SELECT'){const o=el.selectedOptions[0];return o&&o.dataset.k?o.dataset.k:el.value}return el.value}
function evalWhen(form,expr){return expr.split('||').some(g=>g.split(';').every(c=>{const ne=c.includes('!=');const p=c.split(ne?'!=':'=');const v=fval(form,p[0]);const opts=p[1].split('|');return ne?!opts.includes(v):opts.includes(v)}))}
function applyWhen(root){(root||document).querySelectorAll('form').forEach(form=>{form.querySelectorAll('[data-when]').forEach(el=>{const on=evalWhen(form,el.dataset.when);el.hidden=!on;el.querySelectorAll('input,select,textarea').forEach(i=>i.disabled=!on)})})}

/* ---------- Render ---------- */
const PUBLIC=['landing','ingresar','registro','verificar','terminos','privacidad'];
function route(){let r=location.hash.slice(1);if(!r)r=S.session?'inicio':'landing';return r}
function render(){materialize();let r=route();let html='';
  if(r==='verificar'&&!S.need2fa)r=S.session?'inicio':'ingresar';
  if(S.need2fa&&r!=='verificar'&&!['landing','terminos','privacidad'].includes(r))r='verificar';
  if(r==='bienvenida'&&!S.session){if(!S.user)S.user={name:'Vos',email:'vos@ejemplo.com',created:today()};S.session=true;save()}
  if(APP_ROUTES.includes(r)||r==='bienvenida'){if(!S.session)r='ingresar';else if(!S.profile||!S.profile.onboarded)r='bienvenida';else if(r==='bienvenida'&&!UI.obPreview)r='inicio'}
  if(r==='ingresar'&&S.session&&S.profile&&S.profile.onboarded)r='inicio';
  if(V[r])html=V[r]();
  else if(APP_ROUTES.includes(r)){const item=NAV.flatMap(g=>g[1]).find(i=>i[0]===r);if(item&&item[3]&&!S.modules[item[3]])html=shell(r,ph(item[1])+empty('Esta función está apagada','Prendela en Configuración, pestaña Funciones, para usarla.','<button class="btn pri" data-act="go" data-to="configuracion" data-tab="funciones">Ir a Funciones</button>'));else html=shell(r,A[r]())}
  else html=V.landing();
  if(UI.sheet&&SH[UI.sheet.t]){const s=SH[UI.sheet.t](UI.sheet.d);html+='<div class="sheet-wrap"><div class="scrim2" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><header><h2 id="sh-t">'+esc(s[0])+'</h2><button class="ib" data-act="close" aria-label="Cerrar">'+ic('x')+'</button></header><div class="sheet-b">'+s[1]+'</div></div></div>'}
  if(UI.toast)html+='<div class="toast" role="status">'+esc(UI.toast)+'</div>';
  html+=protoNav(r);
  const root=document.getElementById('root');const hadSheet=!!root.querySelector('.sheet');root.innerHTML=html;applyWhen(root);
  const qr=document.getElementById('qr');if(qr&&UI.tfa&&window.QRCode){try{new QRCode(qr,{text:'otpauth://totp/Somos Guafra:'+encodeURIComponent(S.user.email)+'?secret='+UI.tfa.secret+'&issuer=Somos Guafra',width:180,height:180,correctLevel:QRCode.CorrectLevel.M})}catch(e){}}
  if(UI.obFocus&&r==='bienvenida'){UI.obFocus=false;const f=root.querySelector('.ob-body input:not([type=checkbox]):not([type=radio]):not([type=hidden])');if(f&&window.matchMedia('(min-width:981px)').matches)f.focus()}
  if(UI.sheet&&!hadSheet){const f=root.querySelector('.sheet [autofocus],.sheet input:not([type=hidden]):not([type=radio]):not([type=checkbox])');if(f&&window.matchMedia('(min-width:981px)').matches)f.focus()}
  document.title=r==='landing'?'Somos Guafra':'Somos Guafra · '+(({ingresar:'Ingresar',registro:'Crear cuenta',verificar:'Verificación',bienvenida:'Bienvenida'})[r]||((NAV.flatMap(g=>g[1]).find(i=>i[0]===r)||[0,r==='admin'?'Panel interno':''])[1])||'')}
function protoNav(r){if(!UI.proto)return '<div class="proto"><button data-act="proto" aria-expanded="false">Pantallas del prototipo</button></div>';
  const pub=[['landing','Landing'],['registro','Crear cuenta'],['ingresar','Ingresar'],['ob0','Bienvenida · país y moneda'],['ob1','Bienvenida · para qué la usás'],['ob2','Bienvenida · primera cuenta'],['ob3','Bienvenida · resumen']];
  return '<div class="proto"><div class="proto-p" role="menu"><p class="hint" style="padding:2px 4px 6px">Solo para revisar el diseño. Los datos se guardan en este navegador.</p><h6>Público</h6>'+pub.map(p=>'<button data-act="pgo" data-to="'+p[0]+'">'+p[1]+'</button>').join('')+NAV.map(g=>'<h6>'+(g[0]||'App')+'</h6>'+g[1].map(i=>'<button data-act="pgo" data-to="'+i[0]+'">'+i[1]+(i[3]&&S.modules&&!S.modules[i[3]]?' · apagada':'')+'</button>').join('')).join('')+'<h6>Dueño</h6><button data-act="pgo" data-to="admin">Panel interno</button><h6>Datos</h6><button data-act="protoreset" style="color:var(--neg)">'+(UI.confirm==='reset'?'Tocá otra vez para borrar todo':'Empezar de cero')+'</button></div><button data-act="proto" aria-expanded="true">Cerrar</button></div>'}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=ACT[el.dataset.act];if(!a)return;if(el.tagName==='A'||el.tagName==='BUTTON')e.preventDefault();a(el,e)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest&&e.target.closest('.ob-body')&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'){e.preventDefault();obNext();return}if(e.key==='Escape'){if(UI.sheet){UI.sheet=null;render()}else if(UI.menu){UI.menu=false;render()}else if(UI.proto){UI.proto=false;render()}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.row.click')){e.preventDefault();e.target.click()}});
document.addEventListener('submit',e=>{const form=e.target;const n=form.dataset.f;if(!n||!F[n])return;e.preventDefault();const fd=new FormData(form);const f={};for(const [k,v] of fd.entries()){if(k in f){f[k]=[].concat(f[k],v)}else f[k]=v}F[n](f,form)});
document.addEventListener('change',e=>{const el=e.target;const form=el.closest('form');if(form)applyWhen(form.parentNode);const l=el.dataset.live;if(!l)return;
  if(l==='ob'){obSync();UI.ob[el.dataset.k]=el.value;if(el.dataset.k==='country')UI.ob.detected=false;if(el.dataset.k==='country'){const c=COUNTRIES.find(x=>x[0]===el.value);if(c){UI.ob.cur=c[2];UI.ob.acc.cur=c[2];UI.ob.extra=UI.ob.extra.filter(x=>x!==c[2])}}if(el.dataset.k==='cur'){UI.ob.acc.cur=el.value;UI.ob.extra=UI.ob.extra.filter(x=>x!==el.value)}render()}
  if(l==='obx'){const s=new Set(UI.ob.extra);el.checked?s.add(el.value):s.delete(el.value);UI.ob.extra=[...s]}
  if(l==='obu'){const s=new Set(UI.ob.uses);el.checked?s.add(el.value):s.delete(el.value);UI.ob.uses=[...s];const h=document.getElementById('obhave');if(h)h.innerHTML=ic('check')+'<div>'+(UI.ob.uses.length?'Vas a tener: <b>'+obHave(UI.ob.uses).join(', ')+'</b>.':'Si no elegís nada, te prendemos lo básico y lo cambiás cuando quieras.')+'</div>'}
  if(l==='obadd'&&el.value){UI.ob.extra=[...new Set(UI.ob.extra.concat(el.value))];render()}
  if(l==='obm'){UI.ob.mods[el.value]=el.checked;const h=el.closest('section').querySelector('header .hint');if(h)h.textContent=Object.values(UI.ob.mods).filter(Boolean).length+' de '+MODS.length}
  if(l==='mod'){S.modules[el.value]=el.checked;log('Función '+(el.checked?'prendida':'apagada'),el.value);save();render();toast(el.checked?'Prendida':'Apagada')}
  if(l==='bud'){const v=parseMoney(el.value);const k=UI.bm||mk(today());S.budgets[k]=S.budgets[k]||{};if(!v)delete S.budgets[k][el.dataset.c];else S.budgets[k][el.dataset.c]=v;save();render()}
  if(l==='admplan'){S.plan.tier=el.value;log('Plan cambiado por admin',el.value);save();render();toast('Plan actualizado')}
  if(l==='admfree'){const s=new Set(S.settings.freeAlso);el.checked?s.add(el.value):s.delete(el.value);S.settings.freeAlso=[...s];log('Funciones de Free cambiadas',[...s].join(', '));save();render();toast('Guardado')}
  if(l==='impfile'){const file=el.files&&el.files[0];if(!file)return;if(file.size>5e6){toast('El archivo supera 5 MB');return}const rd=new FileReader();rd.onload=()=>{const p=parseCsv(String(rd.result));if(!p.headers.length||!p.rows.length){toast('El archivo está vacío o no tiene filas');return}UI.imp={file:file.name,headers:p.headers,rows:p.rows,map:p.headers.map(guess)};render()};rd.readAsText(file)}
  if(l==='debtp'||l==='grainp')liveInput(el)});
function liveInput(el){const l=el.dataset.live;const form=el.closest('form');
  if(l==='q'){UI.q=el.value;const box=document.getElementById('mlist');if(box)box.innerHTML=movList(UI.mm||mk(today()),tab('mtype','todos'))}
  if(l==='pw'){const v=el.value;let s=0;if(v.length>=10)s++;if(/[A-Z]/.test(v)&&/[a-z]/.test(v))s++;if(/\d/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;const m=document.getElementById('pwm');if(m){m.className='pw-meter s'+s;m.querySelectorAll('i').forEach((i,k)=>i.classList.toggle('on',k<s))}const t=document.getElementById('pwt');if(t)t.textContent=v.length<10?'Te faltan '+(10-v.length)+' caracteres.':['Muy débil','Débil','Aceptable','Buena','Muy buena'][s]}
  if(l==='debtp'){const P=parseMoney(form.elements.principal.value),n=parseInt(form.elements.n.value,10),sys=form.elements.sys.value,tna=parseFloat(String(form.elements.tna.value||'0').replace(',','.'))||0;const box=document.getElementById('dprev');if(!box)return;
    if(!P||!(n>=1&&n<=360)){box.innerHTML=ic('info')+'<div>Completá el monto y las cuotas para ver cuánto vas a pagar.</div>';return}const cur=form.elements.cur.value;const rows=schedule(P,n,tna,sys,today());const tot=rows.reduce((s,r)=>s+r.total,0);
    box.innerHTML=ic('info')+'<div>'+(sys==='frances'||sys==='sin'?n+' cuotas de <b>'+fmt(rows[0].total,cur)+'</b>':'Primera cuota <b>'+fmt(rows[0].total,cur)+'</b>, última <b>'+fmt(rows[rows.length-1].total,cur)+'</b>')+'. En total pagás <b>'+fmt(tot,cur)+'</b>'+(tot>P?', o sea <b>'+fmt(tot-P,cur)+'</b> de intereses.':'.')+(sys!=='sin'&&!tna?' Sin TNA lo calculamos sin interés.':'')+'</div>'}
  if(l==='grainp'){const q=parseMoney(form.elements.qty.value),p=parseMoney(form.elements.price.value);const box=document.getElementById('gprev');if(!box)return;if(!q||!p){box.innerHTML=ic('info')+'<div>1 tonelada son 10 quintales. Completá cantidad y precio para ver el neto.</div>';return}
    const kg=Math.round(q/100*(form.elements.unit.value==='t'?1000:100));const pc=form.elements.pcur.value;let fx=1;if(pc!==base()){fx=parseFloat(String((form.elements.fx||{}).value||'').replace(/\./g,'').replace(',','.'));if(!(fx>0)){box.innerHTML=ic('info')+'<div>El precio está en '+pc+'. Escribí la cotización para calcular en '+base()+'.</div>';return}}
    const c=grainCalc({kg,price:p,fx,taxPct:parseFloat(String(form.elements.tax.value||'0').replace(',','.'))||0,other:parseMoney(form.elements.other.value)||0});box.innerHTML=ic('info')+'<div>'+(kg/100).toLocaleString(loc())+' qq ('+(kg/1000).toLocaleString(loc())+' t). Bruto <b>'+fmt(c.gross)+'</b>, impuesto al cheque <b>'+fmt(-c.tax)+'</b>. <b>Neto '+fmt(c.net)+'</b>.</div>'}}
document.addEventListener('input',e=>{const el=e.target;const l=el.dataset.live;if(l==='q'||l==='pw'||l==='debtp'||l==='grainp')liveInput(el);if(el.closest('[data-f=calc]'))calcOut()});
window.addEventListener('hashchange',()=>{if(location.hash!=='#bienvenida')UI.obPreview=false;UI.sheet=null;UI.menu=false;UI.confirm=null;render();window.scrollTo(0,0)});
render();
})();

<title>NEXO Finanzas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap">
<style>
/* Layout: sidebar permanente (248px) + área de trabajo con barra superior; en teléfono la barra lateral pasa a cajón. */
/* Paleta casi neutra: tinta para acciones y gráficos, verde solo para positivo, rojo solo para negativo/vencido. */
:root{
  --bg:#F6F7F7; --surface:#FFFFFF; --surface-2:#F0F2F2; --line:#E3E6E7; --fg:#15191C; --muted:#5F686D; --faint:#8F979B;
  --ink:#15191C; --on-ink:#FFFFFF;
  --green:#1A7F5A; --green-soft:#E6F2EC; --red:#C4413A; --red-soft:#FBEAE8; --amber:#9A6B0E; --amber-soft:#F7F0E1;
  --blue:#15191C; --blue-soft:#F0F2F2; --slate:#6B7479; --slate-soft:#EEF0F1;
  --c1:#2A3034; --c2:#5F686D; --c3:#8F979B; --c4:#5F686D; --c5:#B5BBBE; --c6:#7B8489; --c7:#CDD1D3;
  --shadow:none;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:"Inter Tight","Inter",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F10; --surface:#151819; --surface-2:#1C2022; --line:#262B2E; --fg:#E9ECED; --muted:#99A2A6; --faint:#6E777B;
  --ink:#E9ECED; --on-ink:#0D0F10;
  --green:#4CC08F; --green-soft:#132820; --red:#EE7B71; --red-soft:#351B19; --amber:#D9A94E; --amber-soft:#2E2512;
  --blue:#E9ECED; --blue-soft:#1C2022; --slate:#99A2A6; --slate-soft:#1E2325;
  --c1:#D5DADC; --c2:#99A2A6; --c3:#6E777B; --c4:#99A2A6; --c5:#4E565A; --c6:#80898D; --c7:#3A4144; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D0F10; --surface:#151819; --surface-2:#1C2022; --line:#262B2E; --fg:#E9ECED; --muted:#99A2A6; --faint:#6E777B;
  --ink:#E9ECED; --on-ink:#0D0F10;
  --green:#4CC08F; --green-soft:#132820; --red:#EE7B71; --red-soft:#351B19; --amber:#D9A94E; --amber-soft:#2E2512;
  --blue:#E9ECED; --blue-soft:#1C2022; --slate:#99A2A6; --slate-soft:#1E2325;
  --c1:#D5DADC; --c2:#99A2A6; --c3:#6E777B; --c4:#99A2A6; --c5:#4E565A; --c6:#80898D; --c7:#3A4144; color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px 24px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 6px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--ink);display:grid;place-items:center;color:var(--on-ink);font-family:var(--f-display);font-weight:700;font-size:15px}
.brand b{font-family:var(--f-display);font-size:17px;letter-spacing:.08em}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:0}
.ws{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;background:var(--surface-2)}
.ws span{color:var(--muted)}
.navg h6{margin:10px 10px 4px;font-size:10.5px;letter-spacing:.12em;color:var(--faint);font-weight:600}
.navg a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;font-size:13.5px}
.navg a:hover{background:var(--surface-2);color:var(--fg)}
.navg a.on{background:var(--surface-2);color:var(--fg);font-weight:600}
.navg a .badge{margin-left:auto}
.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;position:relative}
.search{min-width:0}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;width:100%}
.search kbd{font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;max-height:340px;overflow:auto}
.sres a{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--fg)}
.sres a:hover,.sres a.sel{background:var(--surface-2)}
.sres small{color:var(--muted)}
.ibtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;position:relative;flex:none}
.ibtn:hover{background:var(--surface-2)}
.dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
.menu-btn{display:none}
.demo{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-2);padding:4px 9px;border-radius:999px;white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}

.view{padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1440px;width:100%;animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-family:var(--f-display);font-size:26px;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.crumb{font-size:11.5px;letter-spacing:.1em;color:var(--faint);font-weight:600;text-transform:uppercase}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--blue)}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:14px;font-weight:600}
.card .sub{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:border-color .15s,transform .15s;text-decoration:none;color:inherit}
.kpi:hover{border-color:var(--faint)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:6px}
.kpi .val{font-family:var(--f-display);font-size:23px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .foot{font-size:12px;color:var(--muted)}
.pos{color:var(--green)} .neg{color:var(--red)} .mut{color:var(--muted)} .warn{color:var(--amber)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--slate-soft);color:var(--slate)}
.pill.g{background:var(--green-soft);color:var(--green)} .pill.b{background:var(--blue-soft);color:var(--blue)}
.pill.r{background:var(--red-soft);color:var(--red)} .pill.a{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--fg)}
.pill.o{background:transparent;border:1px dashed var(--slate);color:var(--muted)}
.badge{font-size:10.5px;font-weight:700;background:var(--red);color:#fff;border-radius:999px;padding:1px 6px}

.tw{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.02em}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
td small{display:block;color:var(--muted);font-size:11.5px}
tr.tot td{font-weight:600;background:var(--surface-2)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-weight:500;color:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12px;color:var(--muted)}
.dchip{width:42px;flex:none;text-align:center;border:1px solid var(--line);border-radius:9px;padding:4px 0;line-height:1.1}
.dchip b{display:block;font-size:15px}
.dchip span{font-size:10px;color:var(--muted);text-transform:uppercase}
.sev{width:4px;align-self:stretch;border-radius:4px;flex:none}

svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg .grid{stroke:var(--line);stroke-width:1}
svg .grid.zero{stroke:var(--faint);stroke-dasharray:3 3}
svg .ax{fill:var(--faint);font-size:10.5px;font-family:var(--f-body)}
svg .hit{fill:transparent;cursor:crosshair}
svg .hit:hover{fill:color-mix(in srgb,var(--blue) 7%,transparent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.dash{height:0;border-top:2px dashed;border-radius:0;width:14px}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:7px 9px;border-radius:8px;max-width:260px;white-space:pre-line;font-variant-numeric:tabular-nums;box-shadow:0 6px 24px rgba(0,0,0,.18)}

.fc{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.fc>div{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.fc>div:nth-child(6n){border-right:0}
.fc>div:nth-last-child(-n+6){border-bottom:0}
.fc small{display:block;font-size:11.5px;color:var(--muted)}
.fc b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}

.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--blue-soft);color:var(--fg);font-size:13px}
.notice.a{background:var(--surface-2)} .notice.g{background:var(--green-soft)} .notice.r{background:var(--red-soft)}
.notice b{font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

.ccard{border-radius:16px;padding:18px;color:#fff;background:#1E2326;aspect-ratio:1.586;max-width:340px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 30px rgba(20,40,60,.25)}
.ccard.alt{background:#4A5155}
.ccard .row{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.9}
.ccard .nm{font-size:17px;letter-spacing:.18em;font-variant-numeric:tabular-nums}
.chipg{width:34px;height:25px;border-radius:5px;background:rgba(255,255,255,.28)}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cal .hd{padding:8px;font-size:11.5px;color:var(--muted);font-weight:600;background:var(--surface-2);border-bottom:1px solid var(--line);text-align:center}
.cal .d{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .d:nth-child(7n){border-right:0}
.cal .d.out{background:var(--surface-2);opacity:.55}
.cal .d .dn{font-size:12px;font-weight:600;color:var(--muted)}
.cal .d.today .dn{background:var(--ink);color:var(--on-ink);border-radius:6px;padding:0 6px;align-self:flex-start}
.ev{font-size:11px;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;text-align:left;width:100%}
.ev.in{background:var(--green-soft);color:var(--green)}
.ev.out{background:var(--slate-soft);color:var(--fg)}
.ev.debt{background:var(--blue-soft);color:var(--blue)}
.ev.late{background:var(--red-soft);color:var(--red)}
.ev.prob{background:transparent;border:1px dashed var(--green);color:var(--green)}

.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:50;background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 40px rgba(0,0,0,.12);padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-right:max(20px,env(safe-area-inset-right,0px));overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-family:var(--f-display);font-size:19px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--fg);width:100%}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=range]{width:100%;accent-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--muted);background:var(--surface)}
.step b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:11px}
.step.on{border-color:var(--ink);color:var(--fg)} .step.on b{background:var(--ink);color:var(--on-ink)}
.step.done b{background:var(--green-soft);color:var(--green)}
.src{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);cursor:pointer}
.src:hover{border-color:var(--blue)}
.src.on{border-color:var(--ink);background:var(--surface-2)}
.src b{font-size:13.5px} .src span{font-size:12px;color:var(--muted)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted);background:var(--surface-2)}
.drop.over{border-color:var(--green);background:var(--green-soft)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;font-size:13px}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--on-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.a .src-note{display:block;margin-top:6px;font-size:11px;color:var(--muted)}
.wctl{display:flex;gap:4px}
.wctl button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:12px}
.tree{display:flex;flex-direction:column;gap:2px}
.tree .row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px}
.tree .row:hover{background:var(--surface-2)}
.tree .row.child{padding-left:30px;color:var(--muted)}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.foot-note{font-size:12px;color:var(--faint)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;padding:26px 28px}
.hero .lbl{font-size:13px;color:var(--muted);font-weight:500}
.hero .big{font-family:var(--f-display);font-size:46px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.08;margin:6px 0 8px}
.hero-side{display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line);padding-left:28px}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font-size:13.5px}
.hrow:last-child{border-bottom:0}
.hrow span{color:var(--muted)} .hrow b{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
a.hrow:hover span{color:var(--fg)}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.meter{display:grid;grid-template-columns:minmax(64px,104px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px;padding:6px 0}
.meter .bar i{background:var(--ink)}
.lk{font-size:12.5px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.lk:hover{color:var(--fg)}
.sw-t{position:relative;width:38px;height:22px;flex:none}
.sw-t input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.sw-t span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s;pointer-events:none}

const REAL=[

const fmtN=n=>Math.round(n).toLocaleString('es-AR');

function recDates(r,H){
  const end=md(H-1,31),lim=r.until&&r.until<end?r.until:end,out=[];

}

const CATS={
 g:[['Vivienda',['Alquiler','Expensas','Mantenimiento']],['Alimentación',['Supermercado','Verdulería','Delivery']],['Servicios',['Luz','Gas','Internet','Celular']],['Transporte',['Combustible','Peajes','Transporte público']],['Salud',['Prepaga','Farmacia']],['Educación',['Colegio','Cursos']],['Hogar',['Reparaciones','Electrodomésticos']],['Suscripciones',[]],['Entretenimiento',['Salidas','Viajes']],['Impuestos',['ARCA','ABL','Automotor']],['Seguros',[]],['Extraordinarios',[]],['Otros',[]]],

/* ---------- Motor de eventos: única fuente para flujo, calendario, previsiones y simulador ---------- */
function generate(o={}){
  const H=o.months||61, ev=[], accr=[], cardAcc=[]; const gp=1+(o.gastosPct||0)/100;
  const push=e=>{e.key=e.sale?'sale|'+e.sale+(/\(saldo\)$/.test(e.c)?'|saldo':''):e.c+'|'+dmy(e.due||e.date);if(PAID.has(e.key))return;if(e.date>TODAY||e.late)ev.push(e)};
  let carry=0;
  for(let m=0;m<H;m++){

    let pay;
    if(m===0){pay=CARD.resTotal; if(o.minimo){carry=Math.round((CARD.resTotal-CARD.resMin)*(1+0.075*1.21));pay=CARD.resMin}}
    else pay=(cardAcc[m-1]||0)+(CUOTAS[m-1]||0)+(m===1?REAL_CARD+carry:0);
    if(pay) push({date:adj(md(m,7),1),due:md(m,7),c:m===0?'Visa Galicia — resumen octubre':'Visa Galicia — resumen '+MESL[(mo+11)%12],a:-pay,k:'tar',cert:'conf',cat:'Tarjeta',src:'tarjetas'});
    const sueldo=Math.round(1950000*Math.pow(1.06,Math.floor((m+1)/3)));
    if(m>0||true) push({date:adj(md(m,1),-1),c:'Sueldo de '+MESL[(mo+11)%12]+' — Acme SA',a:sueldo,k:'ing',cert:'conf',cat:'Sueldos',src:'ingresos'});
    if(mo===11) push({date:adj(md(m,18),-1),c:'Aguinaldo (SAC 2.º semestre)',a:Math.round(sueldo/2),k:'ing',cert:'conf',cat:'Sueldos',src:'ingresos'});
    if(mo===5) push({date:adj(md(m,30),-1),c:'Aguinaldo (SAC 1.er semestre)',a:Math.round(sueldo/2),k:'ing',cert:'conf',cat:'Sueldos',src:'ingresos'});
    if(!(o.pierdo&&m>=1)) push({date:adj(md(m,10),1),c:'Alquiler depto. Caballito',a:Math.round(650000*Math.pow(1.14,Math.floor(m/6))),k:'ing',cert:'conf',cat:'Alquileres',src:'ingresos'});
    push({date:adj(md(m,30),1),c:'Consultoría freelance',a:Math.round(250000*Math.pow(1.02,m)),k:'ing',cert:'prob',cat:'Honorarios',src:'ingresos'});
    if(m===4) push({date:adj(md(m,15),-1),c:'Bono anual por desempeño',a:1200000,k:'ing',cert:'hipo',cat:'Extraordinarios',src:'ingresos'});
    if(m===0) push({date:new Date(2026,10,13),c:'Honorarios — Estudio Ruiz (saldo)',a:250000,k:'ing',cert:'conf',cat:'Honorarios',src:'ingresos'});
    if(m===1&&o.extra) push({date:md(1,15),c:'Ingreso extraordinario (simulado)',a:o.extra,k:'ing',cert:'conf',cat:'Extraordinarios'});
    for(const g of GREC){
      if(m===0&&g.skip0)continue;
      const a=Math.round(g.a*Math.pow(1.021,m)*gp), dd=adj(md(m,g.day),1);
      if(dd<=TODAY&&m===0)continue;
      if(g.card){cardAcc[m]=(cardAcc[m]||0)+a;accr.push({date:dd,m,c:g.c,a:-a,cat:g.cat,card:true});}
      else push({date:dd,due:md(m,g.day),c:g.c,a:-a,k:'egr',cert:'conf',cat:g.cat,src:'gastos'});
    }
    push({date:adj(md(m,25),1),c:'Aporte mensual FCI',a:-150000,k:'inv',cert:'conf',cat:'Inversiones',src:'inversiones'});

  for(const d of DEBTS){

/* Ingresos y gastos salen del mismo libro: lo realizado (REAL) y lo pendiente del motor (EV) */
const stat=(l,v,cls='')=>`<div><div class="sub" style="margin:0">${l}</div><b class="num ${cls}" style="font-size:16px">${v}</b></div>`;
function flowRows(inc){
  const pend=EV.filter(e=>e.k===(inc?'ing':'egr')&&(e.late||e.date<=addD(TODAY,45))).map(e=>({c:e.c,cat:e.cat,per:mLabel(mIdx(e.due||e.date)),fecha:e.due||e.date,a:Math.abs(e.a),st:e.late?'Atrasado':e.cert==='prob'?'Probable':e.cert==='hipo'?'Hipotético':'Pendiente',key:e.key}));
  const done=REAL.filter(r=>r.k===(inc?'ing':'egr')).map(r=>({c:r.c,cat:r.cat,per:r.econ,fecha:r.d,a:Math.abs(r.a),st:r.card?'Con tarjeta':r.est==='parcial'?'Parcial':inc?'Cobrado':'Pagado',acc:r.acc,card:r.card}));
  pend.sort((a,b)=>(b.st==='Atrasado')-(a.st==='Atrasado')||a.fecha-b.fecha);done.sort((a,b)=>b.fecha-a.fecha);
  return{pend,done};
}
function flowTable(rows,inc,pending){
  if(!rows.length)return'<div class="empty">Nada por aquí.</div>';
  const pill=s=>({Atrasado:'<span class="pill r">Atrasado</span>',Cobrado:'<span class="pill g">Cobrado</span>',Pagado:'<span class="pill g">Pagado</span>',Probable:'<span class="pill o">Probable</span>'}[s]||`<span class="pill">${s}</span>`);
  return`<div class="tw"><table><thead><tr><th>Concepto</th><th>Corresponde a</th><th>${pending?(inc?'Se cobra':'Vence'):(inc?'Cobrado el':'Pagado el')}</th><th>Estado</th><th class="n">Importe</th>${pending?'<th></th>':''}</tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.c)}<small>${esc(r.cat)}${r.acc?' · '+esc(r.acc):''}${r.card?' · se paga con el resumen':''}</small></td><td>${r.per}</td><td class="num">${dmy(r.fecha)}</td><td>${pill(r.st)}</td><td class="n ${inc?'pos':''}">${money(inc?r.a:-r.a)}</td>${pending?`<td><button class="btn sm" data-act="pay" data-key="${esc(r.key)}">${inc?'Registrar cobro':'Registrar pago'}</button></td>`:''}</tr>`).join('')}</tbody></table></div>`;
}

const accIdOf=l=>{const a=accByLabel(l)||ACC.find(x=>x.inst===l);return a?a.id:ACC_ALIAS[l]||null};
function accMoves(id){
  return REAL.filter(r=>{if(r.k==='trf'){const[x,y]=String(r.acc).split(' → ');return accIdOf(x)===id||accIdOf(y)===id}return accIdOf(r.acc)===id})

function payCalc(){

const SYS={frances:['Francés','Cuota fija todos los meses. Al principio pagás más interés y menos capital.'],aleman:['Alemán','Devolvés la misma parte de capital cada mes. La cuota empieza alta y va bajando.'],americano:['Americano','Pagás solo intereses cada mes y todo el capital en la última cuota.'],sininteres:['Cuotas sin interés','El importe se divide en partes iguales.'],manual:['Cronograma manual','Cargás vos cada cuota con su fecha e importe.'],libre:['Sin cronograma','Para deudas informales: registrás los pagos a medida que los hacés.']};
const DF={acr:'',tipo:'Préstamo personal',monto:'',n:'12',cuota:'',sys:'frances',inicio:'10/12/2026',tna:'',tea:'',cft:''};
const pDate=s=>{const m=String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?new Date(+m[3],+m[2]-1,+m[1]):null};
function schedule(sys,P,n,tna,cuota){
  const i=tna?tna/100/12:0;
  if(sys==='frances'&&i)return french(P,tna,n);
  if(sys==='aleman'&&i){const am=Math.round(P/n);let b=P;return[...Array(n)].map((_,j)=>{const it=Math.round(b*i),a=j===n-1?b:am;b-=a;return{k:j+1,cuota:a+it,int:it,cap:a,saldo:b}})}
  if(sys==='americano'&&i){const it=Math.round(P*i);return[...Array(n)].map((_,j)=>({k:j+1,cuota:it+(j===n-1?P:0),int:it,cap:j===n-1?P:0,saldo:j===n-1?0:P}))}
  const c=cuota||Math.round(P/n),capC=Math.round(P/n);let b=P;
  return[...Array(n)].map((_,j)=>{const a=j===n-1?b:capC;b-=a;return{k:j+1,cuota:j===n-1?c+(a-capC):c,int:c-capC,cap:a,saldo:b}});
}
function dfPlan(){
  const P=parseAR(DF.monto),n=parseInt(DF.n,10),tna=parseAR(DF.tna),c=parseAR(DF.cuota),ini=pDate(DF.inicio);
  if(DF.sys==='libre'||DF.sys==='manual'||isNaN(P)||!(n>0)||!ini)return null;
  const needRate=['frances','aleman','americano'].includes(DF.sys)&&isNaN(tna);
  if(needRate&&isNaN(c))return{faltan:true,ini,fin:new Date(ini.getFullYear(),ini.getMonth()+n-1,ini.getDate())};
  const rows=schedule(needRate?'fijo':DF.sys,P,n,isNaN(tna)?0:tna,isNaN(c)?0:Math.round(c));
  return{rows,ini,fin:new Date(ini.getFullYear(),ini.getMonth()+n-1,ini.getDate()),tot:sum(rows.map(r=>r.cuota)),P};
}
function dfCalc(){
  if(DF.sys==='libre')return'No se generan cuotas. Cada vez que pagues, lo registrás como pago a cuenta.';
  if(DF.sys==='manual')return'Después de guardar vas a cargar cada cuota con su fecha e importe.';
  const p=dfPlan();if(!p)return'Completá el importe, las cuotas y la fecha de la primera cuota.';
  if(p.faltan)return`Va del ${dmy(p.ini)} al ${dmy(p.fin)}. Para calcular las cuotas, cargá el importe de la cuota o la TNA (lo que tengas).`;
  const r=p.rows,igual=r.every(x=>x.cuota===r[0].cuota);
  return`Va del ${dmy(p.ini)} al ${dmy(p.fin)}. ${igual?`Cuota de ${money(r[0].cuota)}`:`Primera cuota ${money(r[0].cuota)}, última ${money(r[r.length-1].cuota)}`}. Total a devolver ${money(p.tot)}${p.tot>p.P?`, de los cuales ${money(p.tot-p.P)} son intereses`:''}.`;
}

  DEBTS.push(base);Object.assign(DF,{acr:'',monto:'',cuota:'',tna:'',tea:'',cft:''});S.deudaSel=id;recompute();closeOverlay();render();toast('Deuda guardada. Sus cuotas ya aparecen en Próximos pagos y en el flujo de caja.');
}

V.flujo=()=>{

  const rows=months(filt(EV,S.flujoC),S.flujoH),def=m=>S.real?1/Math.pow(1.021,m):1,f=(v,m)=>money(Math.round(v*def(m)));
  const pick=i=>rows[Math.min(i,rows.length-1)],mx=Math.max(1,...rows.map(r=>Math.abs(r.end)));

  `<div class="card"><div class="fsteps">${step('Hoy',BAL0)}<i>→</i>${step('Fin de mes',pick(0).end)}<i>→</i>${step('En 6 meses',pick(5).end)}<i>→</i>${step(S.flujoH>12?`En ${S.flujoH/12} años`:'En 1 año',pick(S.flujoH-1).end)}</div>
   <p class="sub" style="margin-top:12px">${neg.length?`<span class="neg">${neg.length} ${neg.length===1?'mes termina':'meses terminan'} con menos plata de la que empiezan:</span> ${neg.slice(0,4).map(r=>mLong(r.m)).join(', ')}${neg.length>4?'…':''}.`:'<span class="pos">Ningún mes termina con menos plata de la que empieza.</span>'}</p></div>

V.previsiones=()=>{
  const days=[...Array(120)].map((_,i)=>addD(TODAY,i));const c=filt(EV,'conf'),p=filt(EV,'prob'),h=filt(EV,'hipo');
  const dc=days.map(d=>balAt(c,d)),dp=days.map(d=>balAt(p,d)),dh=days.map(d=>balAt(h,d));

function simRun(){
  const s=S.sim;const sc=generate({cancelIds:[...S.cancelados],gastosPct:s.gastosPct,extra:s.extra,pierdo:s.pierdo,cancel:s.cancel,invertir:s.invertir,minimo:s.minimo,months:25});
  const b=months(filt(EV,'conf'),24),r=months(filt(sc.ev,'conf'),24);
  const invAcc=(rows,extra)=>{let v=0;return rows.map(()=>{v=v*1.025+extra;return v})};
  const ib=invAcc(b,150000),ir=invAcc(r,150000+s.invertir);
  const minB=Math.min(...b.map(x=>x.end)),minR=Math.min(...r.map(x=>x.end));const neg=r.find(x=>x.end<0);
  const gal=DEBTS[0];const ahorro=s.cancel?gal.futSum-gal.canc:0;const costMin=s.minimo?Math.round((CARD.resTotal-CARD.resMin)*0.075*1.21):0;

  ${[['Saldo a 6 meses',b[5].end,r[5].end],['Saldo a 12 meses',b[11].end,r[11].end],['Saldo a 24 meses',b[23].end,r[23].end],['Inversiones acumuladas (2,5% mensual)',Math.round(ib[23]),Math.round(ir[23])],['Liquidez + inversiones a 24 meses',b[23].end+Math.round(ib[23]),r[23].end+Math.round(ir[23])]].map(([n,x,y])=>`<tr><td>${n}</td><td class="n">${money(x)}</td><td class="n">${money(y)}</td><td class="n ${y-x<0?'neg':'pos'}">${sgn(y-x)}</td></tr>`).join('')}</tbody></table></div>
  <div class="acts" style="margin-top:12px"><button class="btn pri" data-act="toast" data-msg="En la app: genera acciones concretas para que confirmes una por una.">Aplicar acciones al plan real…</button><button class="btn" data-act="toast" data-msg="Escenario guardado (simulación).">Guardar escenario</button></div></div>`;
}

function insights(){
  const r12=months(filt(EV,'conf'),12);const out=[];
  const defs=r12.filter(r=>r.res<0);
  if(defs.length)out.push({s:'r',t:`${defs.length} meses con déficit en los próximos 12`,d:`${defs.map(r=>mLong(r.m)).join(', ')} terminan con menos saldo del que empiezan (solo confirmados).`,go:'flujo'});
  const mn=Math.min(...r12.map(r=>r.end));if(mn<recMensual)out.push({s:mn<0?'r':'a',t:'Riesgo de liquidez',d:`El saldo proyectado baja a ${money(mn)}, menos de un mes de gastos recurrentes (${money(recMensual)}).`,go:'previsiones'});
  if(late.length)out.push({s:'r',t:`${late.length} ${late.length===1?'vencimiento atrasado':'vencimientos atrasados'} por ${money(-sum(late.map(e=>e.a)))}`,d:late.map(e=>e.c).join(' · ')+'. Siguen pendientes hasta que los registres.',go:'vencimientos'});
  const caras=DEBTS.filter(d=>d.cft>100&&!S.cancelados.has(d.id)).sort((a,b)=>(b.futSum-b.canc)-(a.futSum-a.canc));
  if(caras.length)out.push({s:'a',t:'Deudas costosas',d:`${caras.map(d=>d.acr+' (CFT '+pct(d.cft)+')').join(' y ')}. Cancelar ${caras[0].acr} hoy ahorra ${money(caras[0].futSum-caras[0].canc)} en intereses.`,go:'deudas'});
  const ing=sum(r12.map(r=>r.pi)),sue=sum(EV.filter(e=>e.cat==='Sueldos'&&mIdx(e.date)<12&&e.cert==='conf').map(e=>e.a));
  out.push({s:'a',t:'Concentración de ingresos',d:`El ${pct(sue/ing*100,0)} de tus ingresos confirmados viene de un solo empleador.`,go:'ingresos'});
  out.push({s:'b',t:'Gastos recurrentes elevados',d:`Los gastos fijos (${money(recMensual)}) representan el ${pct(recMensual/(1950000+650000)*100,0)} de tus ingresos mensuales confirmados.`,go:'reglas'});

function parseCSV(txt){
  const lines=txt.replace(/\r/g,'').split('\n').filter(l=>l.trim());const first=lines[0]||'';
  const del=[';','\t',','].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const split=l=>{const o=[];let c='',q=false;for(const ch of l){if(ch==='"'){q=!q}else if(ch===del&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(s=>s.trim())};
  return {del,headers:split(first),rows:lines.slice(1).map(split)};
}
const FIELDS=[['fecha','Fecha'],['concepto','Concepto'],['importe','Importe'],['moneda','Moneda'],['cuenta','Cuenta'],['categoria','Categoría'],['tipo','Tipo'],['ignorar','Ignorar']];
function guess(h){const s=h.toLowerCase();if(/fech|date/.test(s))return'fecha';if(/concep|descr|detalle|memo/.test(s))return'concepto';if(/import|monto|amount|valor/.test(s))return'importe';if(/moneda|curr/.test(s))return'moneda';if(/cuenta|account/.test(s))return'cuenta';if(/categ/.test(s))return'categoria';if(/tipo|type/.test(s))return'tipo';return'ignorar'}
function loadImport(name,txt){const I=S.imp;I.file=name;
  if(/\.json$/i.test(name)){try{let j=JSON.parse(txt);if(!Array.isArray(j))j=j.movimientos||j.transactions||Object.values(j).find(Array.isArray)||[];I.headers=Object.keys(j[0]||{});I.rows=j.map(o=>I.headers.map(h=>String(o[h]??'')))}catch(e){toast('El archivo JSON no es válido: '+e.message);return}}
  else{const p=parseCSV(txt);I.headers=p.headers;I.rows=p.rows;I.del=p.del}
  I.map={};I.headers.forEach((h,i)=>I.map[i]=guess(h));I.step=3;render();}
function validate(){
  const I=S.imp;const col=f=>Object.keys(I.map).find(k=>I.map[k]===f);const cf=col('fecha'),ci=col('importe'),cc=col('concepto');
  const ok=[],bad=[],dup=[];const exist=new Set(REAL.map(r=>dmy(r.d)+'|'+Math.round(r.a)));
  I.rows.forEach((r,i)=>{const d=r[cf]||'';const m=d.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);const raw=(r[ci]||'').replace(/\./g,'').replace(',','.');const a=Number(raw);
    if(!m||+m[2]>12||+m[1]>31){bad.push({i,r,why:'Fecha inválida (se espera dd/mm/aaaa)'});return}
    if(!raw||isNaN(a)){bad.push({i,r,why:'Importe no numérico'});return}
    if(exist.has(d+'|'+Math.round(a))){dup.push({i,r,why:'Ya existe un movimiento con misma fecha e importe'});return}
    ok.push({i,r,a})});
  return {ok,bad,dup,col:{cf,ci,cc}};
}

const FREQ={mensual:'todos los meses',bimestral:'cada 2 meses',trimestral:'cada 3 meses',semestral:'cada 6 meses',anual:'una vez por año',semanal:'todas las semanas',quincenal:'cada 15 días'};
const STEP={mensual:1,bimestral:2,trimestral:3,semestral:6,anual:12};
const parseAR=s=>{s=String(s??'').replace(/[^\d,.-]/g,'');if(!s)return NaN;return Number(s.replace(/\./g,'').replace(',','.'))};
const freqTxt=r=>FREQ[r.freq]+(STEP[r.freq]?` · día ${r.day}`:'');
function nmTipo(t){NM.tipo=t;NM.estado='pagado';NM.pagado='';NM.catNew='';NM.cat=t==='ingreso'?'Sueldos':'Alimentación'}
const nmFreq=()=>NM.rep==='mensual'?'mensual':NM.freq;
function nmRuleStart(){
  const f=nmFreq();if(!STEP[f])return pDate(NM.inicio);
  const d=parseInt(NM.dia,10),at=(y,m)=>new Date(y,m,Math.min(d,new Date(y,m+1,0).getDate()));
  if(NM.estado==='pendiente'){const c=at(TODAY.getFullYear(),TODAY.getMonth());return c>TODAY?c:at(TODAY.getFullYear(),TODAY.getMonth()+1)}
  return at(TODAY.getFullYear(),TODAY.getMonth()+STEP[f]);
}
function nmCalc(){
  const n=NM,g=n.tipo==='gasto',tot=parseAR(n.importe),pg=parseAR(n.estado==='pagado'?(n.pagado||n.importe):n.pagado);
  const sale=g?'Salen':'Entran',de=g?'de':'a',card=g&&n.cuenta==='Visa Galicia';
  if(isNaN(tot))return'Ingresá el importe para ver cómo queda.';
  if(n.estado==='pendiente')return n.rep!=='no'?`Queda ${g?'por pagar':'por cobrar'} ${money(tot)}. Tu saldo no cambia hasta que lo registres.`:`Queda ${g?'por pagar':'por cobrar'} ${money(tot)} para el ${n.vence}. Tu saldo no cambia hasta que lo registres.`;
  if(isNaN(pg))return`Ingresá cuánto ${g?'pagaste':'cobraste'}.`;
  if(card)return`Se carga ${money(pg)} en la tarjeta: el dinero sale cuando pagues el resumen, así no se cuenta dos veces.`;
  if(n.estado==='parcial')return pg>=tot?`Eso cubre el total: elegí "${g?'Pagado':'Cobrado'}".`:`${sale} ${money(pg)} ${de} tu cuenta y quedan ${money(tot-pg)} pendientes para el ${n.vence}.`;
  if(pg!==tot)return`${sale} ${money(pg)} ${de} tu cuenta. Se guarda que el importe final fue distinto del previsto (${sgn(pg-tot)}).`;
  return`${sale} ${money(pg)} ${de} tu cuenta y queda registrado como ${g?'pagado':'cobrado'}.`;
}
function recCalc(){
  if(NM.rep==='no')return'';const f=nmFreq(),st=nmRuleStart();

}

    ${n.rep==='no'?'':`<div class="frow">${n.rep==='otra'?`<label class="field">Frecuencia<select id="nm-freq" data-nm="freq">${Object.entries(FREQ).filter(([k])=>k!=='mensual').map(([k,l])=>`<option value="${k}" ${k===n.freq?'selected':''}>${l[0].toUpperCase()+l.slice(1)}</option>`).join('')}</select></label>`:''}
      ${STEP[f]?`<label class="field">Día del mes<select id="nm-dia" data-nm="dia">${[...Array(31)].map((_,i)=>`<option ${String(i+1)===n.dia?'selected':''}>${i+1}</option>`).join('')}</select></label>`:fld('inicio','Próxima fecha',n.inicio,'dd/mm/aaaa')}
      ${n.rep==='mensual'?fld('hasta','Hasta (opcional)',n.hasta,'dd/mm/aaaa'):''}</div>

function nmSave(){
  const n=NM,g=n.tipo==='gasto',t=n.tipo==='transferencia',tot=parseAR(n.importe),fp=pDate(n.fpago);
  if(!t&&!n.concepto.trim())return toast('Falta el concepto.');
  if(isNaN(tot)||tot<=0)return toast('Ingresá un importe mayor a cero.');
  if(t){
    const from=accByLabel(n.desde),to=accByLabel(n.hacia);if(from===to)return toast('Elegí dos cuentas distintas.');
    let amtTo=tot;if(from.cur!==to.cur){const tc=parseAR(n.tc);if(!(tc>0))return toast('Ingresá la cotización usada.');amtTo=from.cur==='ARS'?Math.round(tot/tc*100)/100:Math.round(tot*tc)}
    from.bal-=tot;to.bal+=amtTo;REAL_TRF+=(isPool(to)?amtTo:0)-(isPool(from)?tot:0);
    REAL.push({d:fp||new Date(TODAY),c:`Transferencia ${from.inst} → ${to.inst}`,a:tot,k:'trf',cat:'Transferencia',acc:`${from.inst} → ${to.inst}`,econ:'—',m:0});
    Object.assign(NM,{importe:''});recompute();closeOverlay();render();return toast('Transferencia guardada. No cuenta como ingreso ni gasto.');
  }
  const pg=n.estado==='pagado'?parseAR(n.pagado||n.importe):n.estado==='parcial'?parseAR(n.pagado):0,rec=n.rep!=='no',vence=pDate(n.vence);
  let cat=n.cat,t2=g?'g':'i';
  if(cat==='__new'){const nc=n.catNew.trim();if(!nc)return toast('Escribí el nombre de la nueva categoría.');addCat(t2,nc);cat=CATS[t2].find(c=>c[0].toLowerCase()===nc.toLowerCase())[0]}
  if(n.estado!=='pendiente'&&(isNaN(pg)||pg<=0))return toast(`Ingresá cuánto ${g?'pagaste':'cobraste'}.`);
  if(n.estado==='parcial'&&pg>=tot)return toast(`Eso cubre el total: elegí "${g?'Pagado':'Cobrado'}".`);
  if(n.estado==='pagado'&&!fp)return toast('Revisá la fecha (dd/mm/aaaa).');
  if((n.estado==='parcial'||(n.estado==='pendiente'&&!rec))&&!vence)return toast('Revisá la fecha de vencimiento (dd/mm/aaaa).');
  const start=rec?nmRuleStart():null,hasta=rec&&n.hasta.trim()?pDate(n.hasta):null;
  if(rec&&!start)return toast('Revisá la próxima fecha (dd/mm/aaaa).');if(rec&&n.hasta.trim()&&!hasta)return toast('Revisá la fecha "hasta" (dd/mm/aaaa).');
  const c=n.concepto.trim(),sg=g?-1:1,card=g&&n.cuenta==='Visa Galicia',acc=card?null:accByLabel(n.cuenta),src=g?'gastos':'ingresos';
  if(n.estado!=='pendiente'){
    if(acc){acc.bal+=sg*pg;if(isPool(acc)){if(g)REAL_EGR+=pg;else REAL_ING+=pg}}
    REAL.push({d:(n.estado==='pagado'&&fp)||new Date(TODAY),c,a:sg*pg,k:g?'egr':'ing',cat,acc:n.cuenta,econ:n.per.slice(0,3)+' '+n.per.slice(-2),m:0,est:n.estado,card});
  }
  if(n.estado==='parcial')EXTRA.push({due:vence,c:c+' (saldo)',a:sg*(tot-pg),k:g?'egr':'ing',cert:'conf',cat,src});
  if(n.estado==='pendiente'&&!rec)EXTRA.push({due:vence,c,a:sg*tot,k:g?'egr':'ing',cert:'conf',cat,src});
  if(rec)USER_REC.push({id:'r'+Date.now(),c,a:tot,k:g?'egr':'ing',cat,freq:nmFreq(),day:parseInt(n.dia,10),start,until:hasta,variable:n.variable});
  const created=n.cat==='__new'?` Se creó la categoría "${cat}".`:'';
  const msg=n.estado==='parcial'?`Guardado. Quedan ${money(tot-pg)} pendientes.`:n.estado==='pendiente'&&!rec?`Guardado como pendiente para el ${n.vence}.`:`${g?'Gasto':'Ingreso'} guardado.`;
  Object.assign(NM,{concepto:'',importe:'',pagado:'',catNew:'',cat:cat,rep:'no',hasta:'',variable:false});
  recompute();closeOverlay();render();toast(msg+(rec?` Se repite ${FREQ[USER_REC[USER_REC.length-1].freq]}.`:'')+created);
}

function qrSVG(){let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647,N=25,c=[];
  const fin=(x,y)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++){const b=i===0||j===0||i===6||j===6||(i>1&&i<5&&j>1&&j<5);if(b)c.push([x+i,y+j])}};
  fin(0,0);fin(N-7,0);fin(0,N-7);
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const inF=(i<8&&j<8)||(i>N-9&&j<8)||(i<8&&j>N-9);if(!inF&&rnd()>.52)c.push([i,j])}
  return`<svg viewBox="-2 -2 ${N+4} ${N+4}" class="qr" role="img" aria-label="Código QR de ejemplo"><rect x="-2" y="-2" width="${N+4}" height="${N+4}" style="fill:#fff"/>${c.map(([x,y])=>`<rect x="${x}" y="${y}" width="1" height="1" style="fill:#111"/>`).join('')}</svg>`}

  <div class="tf-box">${qrSVG()}<div><div class="sub">Clave</div><b class="num sel">NEXO 4F7K Q2ZP 9MTD</b></div></div>
  <label class="field">Código de 6 números<input id="tf-code" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000 000"></label>`;
PUB.twofaSetup=()=>authWrap(`<h1>Protegé tu cuenta</h1><p class="sub">Activá la verificación en dos pasos. Te lleva un minuto.</p>${twofaSetupHTML()}<p class="sub">En este prototipo sirve cualquier código de 6 números.</p>

function afterPub(m){
  if(m==='landing'){
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count;if(reduce){el.textContent=money(to);return}const t0=performance.now();const tick=t=>{const p=Math.min(1,(t-t0)/1300),v=Math.round(to*(1-Math.pow(1-p,3)));el.textContent=money(v);if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)});
    if('IntersectionObserver' in window&&!reduce){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.15});document.querySelectorAll('.rv').forEach(el=>io.observe(el))}
  }
  if(m==='login')setTimeout(()=>document.getElementById('li-mail')?.focus(),30);
  if(m==='signup')setTimeout(()=>document.getElementById('su-name')?.focus(),30);
  if(m==='twofa'||m==='twofaSetup')setTimeout(()=>document.getElementById('tf-code')?.focus(),30);
}
